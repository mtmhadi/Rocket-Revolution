<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الزراعة الفضائية | Space Farming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fb;--surface:#fff;--ink:#1a1535;--mute:#5d5878;--line:#dedaf0;--p:#5b2bd9;--g:#2fa37a;--b:#3a7fc4;--soft:#ece7fc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f5f4fb}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:84px;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.85;font-size:17px}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:22px}
/* gate */
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 20% 15%,#e6defc 0,transparent 45%),radial-gradient(circle at 85% 85%,#d4f0e6 0,transparent 45%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;transition:opacity .5s,visibility .5s}
#gate.off{opacity:0;visibility:hidden}
.gate-in{text-align:center;max-width:620px;width:100%}
.logos{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;direction:ltr}
.logos img{display:block}
.logos .l1{height:46px}.logos .l2{height:78px}
.logos i{width:1px;height:56px;background:var(--line)}
.gate h1{font-size:clamp(26px,5vw,38px);margin:30px 0 4px;line-height:1.4}
.gate p{margin:0;color:var(--mute)}
.badge{display:inline-block;margin-top:18px;background:var(--p);color:#fff;padding:5px 18px;border-radius:99px;font-weight:700;font-size:15px}
.choose{display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:2px solid var(--p);background:var(--p);color:#fff;padding:12px 34px;border-radius:14px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px);background:#4a1fbd}
.btn.alt{background:transparent;color:var(--p)}
.btn.alt:hover{background:var(--soft)}
.choose .btn{min-width:170px;font-size:20px}
/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(245,244,251,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
nav .mini{direction:ltr;display:flex;gap:14px;align-items:center}
nav .mini img{height:28px}nav .mini img+img{height:40px}
.links{display:flex;gap:20px;font-size:15px}
.links a{text-decoration:none;color:var(--mute);font-weight:500}.links a:hover{color:var(--p)}
.lang{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--p);color:var(--p);background:none;border-radius:99px;padding:3px 16px;cursor:pointer}
@media(max-width:820px){.links{display:none}}
/* hero */
.hero{padding:70px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(46px,9vw,92px);line-height:1.15;margin:14px 0 10px;font-weight:700;letter-spacing:-.01em}
.hero p.sub{font-size:clamp(18px,2.4vw,22px);color:var(--mute);max-width:30em;margin:0 0 6px}
.school{font-weight:700;color:var(--g);margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.orbit{width:100%;max-width:400px;margin-inline:auto;display:block}
.spin{transform-origin:200px 200px;animation:sp 40s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.orbit{max-width:260px;order:-1}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}html{scroll-behavior:auto}}
/* sections */
section{padding:56px 0}
h2{font-size:clamp(28px,4vw,40px);line-height:1.4;margin:0 0 14px}
.lead{max-width:44em;color:var(--mute);margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:34px;border-block:1px solid var(--line)}
.facts div{padding:22px 16px;text-align:center}
.facts div+div{border-inline-start:1px solid var(--line)}
.facts b{display:block;font-size:34px;color:var(--p);line-height:1.3}
.facts span{color:var(--mute);font-size:15px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 18px}
.tab{font:inherit;font-weight:500;font-size:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 20px;border-radius:99px;cursor:pointer}
.tab[aria-selected=true]{background:var(--p);border-color:var(--p);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px clamp(20px,4vw,40px);min-height:190px}
.panel h3{margin:0 0 8px;font-size:24px;color:var(--p)}
.panel p{margin:0;max-width:46em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
@media(max-width:820px){.grid,.facts{grid-template-columns:1fr}.facts div+div{border-inline-start:0;border-top:1px solid var(--line)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;border-top:5px solid var(--c,var(--p))}
.card h3{margin:0 0 6px;font-size:21px}
.card p{margin:0;color:var(--mute);font-size:16px;line-height:1.8}
.band{background:var(--ink);color:#fff;border-radius:28px;padding:44px clamp(22px,5vw,56px)}
.band .lead{color:#cfc9ea}
.band h2{color:#fff}
.band h3{margin:22px 0 4px;color:#9fe3c8;font-size:19px}
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px}
@media(max-width:620px){.team{grid-template-columns:1fr}}
.person{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.av{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--b),var(--g));color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.person b{display:block;font-size:20px;line-height:1.4}
.person span{color:var(--mute);font-size:15px}
footer{padding:40px 0 50px;border-top:1px solid var(--line);margin-top:30px}
footer .wrap{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;color:var(--mute);font-size:15px}
</style>
</head>

const T={
ar:{n1:"لماذا الفضاء؟",n2:"التحديات",n3:"الحلول",n4:"الإنجازات",n5:"فريق العمل",badge:"أسبوع الفضاء",
title:"الزراعة الفضائية",sub:"كيف نُطعم رواد الفضاء بعيدًا عن الأرض؟ رحلة قصيرة بين الجذور والنجوم.",school:"ثانوية الموهوبين التقنية",c1:"ابدأ الرحلة",c2:"تعرّف على الفريق",
why_h:"لماذا نزرع في الفضاء؟",why_p:"مع التخطيط لمستوطنات على القمر ورحلات إلى المريخ تستغرق سنوات، لم يعد شحن الطعام المجفف من الأرض حلاً مستدامًا: تكلفة الوزن فلكية، والقيمة الغذائية تتراجع مع الوقت. لذلك صارت زراعة النباتات في الفضاء ضرورة، وعلمًا يجمع بين الأحياء وفيزياء السوائل وهندسة الفضاء.",
f1:"دقيقة بين كل شروق وغروب على المحطة",f2:"مستشعر في حاضنة APH",f3:"أول خس أحمر يُؤكل من الفضاء",
ch_h:"خمسة تحديات أمام النبتة",ch_p:"اختر تحديًا لتعرف كيف تتصرف النبتة خارج الأرض.",
tabs:[
{t:"الجاذبية",h:"نبتة بلا بوصلة",b:"على الأرض تعرف الجذور اتجاه الأسفل بفضل جسيمات نشوية ثقيلة تُسمى الستاتوليثات تستقر في قاع الخلايا. في الجاذبية الصغرى تسبح هذه الجسيمات عشوائيًا، فتنمو الجذور في كل اتجاه وتتشابك. يعوّض العلماء ذلك بإضاءة أحادية الاتجاه تجذب الساق والأوراق نحو الضوء، فتستقر الجذور في الاتجاه المعاكس."},
{t:"الماء",h:"ماء يسبح في الهواء",b:"في الفضاء تحكم السوائلَ قوى التوتر السطحي، فيتكوّن الماء كرات تسبح أو يلتصق بالأسطح. وفي التربة العادية يغلّف الجذور فيمنع الأكسجين ويسبب تعفنها، وإن قلّ مات النبات عطشًا. لذلك استُبعدت التربة تمامًا."},
{t:"الضوء",h:"حقل أرجواني",b:"تدور المحطة حول الأرض فتشهد شروقًا وغروبًا كل 90 دقيقة، فلا يُعتمد على ضوء الشمس. تُستخدم مصابيح LED حمراء وزرقاء لأن النبات يستفيد منها أكثر، فيبدو الحقل أرجوانيًا. وأُضيف قليل من الأخضر ليرى البشر الأوراق خضراء ويكتشفوا الاصفرار والأمراض مبكرًا."},
{t:"الهواء",h:"غاز الإيثيلين",b:"ثاني أكسيد الكربون أعلى في المحطة بسبب تنفس الطاقم، وقد يضر بعض الأنواع. والأخطر غاز الإيثيلين الذي تطلقه النباتات؛ فلا رياح تبعثره، فيتراكم ويوهم النبتة أنها شاخت فتذبل خلال أيام. تحلّه مراوح دقيقة وفلاتر تنقّي الهواء باستمرار."},
{t:"الإشعاع",h:"حماية الحمض النووي",b:"خارج الغلاف الجوي والحقل المغناطيسي للأرض تتعرض البذور لأشعة كونية قد تُتلف الحمض النووي وتسبب طفرات تغيّر القيمة الغذائية. تدرس وكالات الفضاء حماية الحواضن واختيار بذور قادرة على إصلاح حمضها النووي ذاتيًا قبل رحلات المريخ."}],
so_h:"حلول بدل التربة",so_p:"ثلاث تقنيات تسمح للجذور بالماء والهواء معًا.",
sol:[{t:"وسائد الزراعة",b:"أكياس نسيجية فيها مادة صلصالية مسامية (Arcillite) تحبس كمية محددة من الماء وتسمح بمرور الهواء، وتُزرع فيها البذور مع السماد.",c:"#5b2bd9"},
{t:"الزراعة المائية",b:"تنمو الجذور داخل أنابيب مغلقة يمر فيها غشاء رقيق محسوب من ماء محمّل بالمغذيات.",c:"#3a7fc4"},
{t:"الزراعة الهوائية",b:"جذور معلقة في صندوق مظلم تُرشّ بضباب رقيق من الماء والمغذيات. هي الأكثر توفيرًا للماء.",c:"#2fa37a"}],
mi_h:"من المختبر إلى المحطة",mi_p:"تجارب حقيقية تعمل اليوم على متن محطة الفضاء الدولية.",
mis:[{t:"نظام Veggie",b:"أقدم حاضنة وأبسطها. زرعت ناسا فيها الخس والملفوف والخردل، وفي 2015 تذوق الرواد خسًا أحمر زُرع وحُصد في الفضاء.",c:"#2fa37a"},
{t:"أزهار الزينيا",b:"تجربة لتعلّم زراعة نباتات تحتاج وقتًا أطول وتزهيرًا معقدًا. أنقذها سكوت كيلي من الفطريات لتتفتح أول زهرة في تاريخ الفضاء.",c:"#5b2bd9"},
{t:"موطن النباتات المتقدم APH",b:"نظام مغلق بأكثر من 180 مستشعرًا يضبط الرطوبة والحرارة والضوء. زُرع فيه الفجل وفلفل تشيلي، وأُعدّت وجبة تاكو بالفلفل الفضائي.",c:"#3a7fc4"}],
ps_h:"النبات رفيق نفسي أيضًا",ps_p:"يعيش الطاقم في بيئة معزولة مليئة بالمعدات وأصوات المراوح. وجود كائن أخضر ينمو يكسر هذه الرتابة، ويرى علماء نفس ناسا أن ريّ النباتات وقياس أوراقها متنفس نفسي مهم (علاج بستاني) يحفظ الصحة العقلية والمزاج خلال مهمات تمتد لشهور أو سنوات.",
sa_h:"من الفضاء إلى أرضنا",sa_p:"تقنيات توفير الماء وزراعة بلا تربة التي تُطوَّر للفضاء هي نفسها ما يحتاجه الزراعة في المناطق الصحراوية الشحيحة المياه. ما نتعلمه هناك يخدم الأمن الغذائي هنا.",
tm_h:"فريق العمل",tm_p:"أعدّ هذا المشروع طالبان من ثانوية الموهوبين التقنية للمشاركة في أسبوع الفضاء.",role:"طالب | ثانوية الموهوبين التقنية",n_1:"محمد تركي علي",n_2:"تركي منصور محمد",a1:"م",a2:"ت",

en:{n1:"Why space?",n2:"Challenges",n3:"Solutions",n4:"Milestones",n5:"Team",badge:"Space Week",
title:"Space Farming",sub:"How do we feed astronauts far from Earth? A short trip between roots and stars.",school:"Technical Gifted High School",c1:"Start the journey",c2:"Meet the team",
why_h:"Why grow food in space?",why_p:"With lunar settlements and multi-year Mars missions on the horizon, shipping dried food from Earth no longer works: weight costs are astronomical and nutrients degrade over time. Growing plants in space has become essential, and a science that blends biology, fluid physics and space engineering.",
f1:"minutes between sunrises on the station",f2:"sensors in the APH growth chamber",f3:"first red lettuce eaten from space",
ch_h:"Five challenges for a plant",ch_p:"Pick a challenge to see how a plant copes beyond Earth.",
tabs:[
{t:"Gravity",h:"A plant without a compass",b:"On Earth, roots sense “down” through heavy starch particles called statoliths that settle at the bottom of cells. In microgravity they drift randomly, so roots grow in every direction and tangle. Scientists compensate with one-directional light that pulls shoots toward it, anchoring the roots the opposite way."},
{t:"Water",h:"Water that floats",b:"In space, liquids are ruled by surface tension, so water forms floating spheres or clings to surfaces. In ordinary soil it coats the roots, blocks oxygen and causes rot; too little and the plant dies of thirst. So soil was dropped entirely."},
{t:"Light",h:"A purple field",b:"The station circles Earth with a sunrise every 90 minutes, so sunlight can't be relied on. LEDs in red and blue are used because plants use them best, making the field glow purple. A little green is added so humans see green leaves and spot yellowing or disease early."},
{t:"Air",h:"The ethylene problem",b:"CO2 is higher on the station because of the crew's breathing, and can harm some species. Worse is ethylene, released by plants: with no wind it builds up and tricks them into aging, wilting in days. Tiny fans and filters clear it constantly."},
{t:"Radiation",h:"Protecting DNA",b:"Beyond Earth's atmosphere and magnetic field, seeds face cosmic rays that can damage DNA and cause mutations that change nutrition. Agencies are studying shielding and seeds that can repair their own DNA before Mars missions."}],
so_h:"Alternatives to soil",so_p:"Three technologies that give roots both water and air.",
sol:[{t:"Plant Pillows",b:"Fabric bags filled with porous clay-like Arcillite that holds a set amount of water while letting air through. Seeds and fertilizer go inside.",c:"#5b2bd9"},
{t:"Hydroponics",b:"Roots grow in closed tubes where a thin, measured film of nutrient-rich water flows past.",c:"#3a7fc4"},
{t:"Aeroponics",b:"Roots hang in a dark chamber and are misted with fine water and nutrients. It's the most water-efficient method of all.",c:"#2fa37a"}],
mi_h:"From lab to station",mi_p:"Real experiments running on the International Space Station.",
mis:[{t:"Veggie",b:"The oldest and simplest chamber. NASA grew lettuce, cabbage and mustard, and in 2015 astronauts tasted red lettuce grown and harvested in space.",c:"#2fa37a"},
{t:"Zinnia flowers",b:"A test of growing plants that need longer and flower in complex ways. Scott Kelly saved them from mold, and the first flower in space history bloomed.",c:"#5b2bd9"},
{t:"Advanced Plant Habitat",b:"A sealed system with 180+ sensors controlling humidity, heat and light. It grew radishes and chile peppers, and tacos were made with space-grown peppers.",c:"#3a7fc4"}],
ps_h:"Plants are good company too",ps_p:"Crews live in isolated spaces full of equipment and fan noise. A growing green thing breaks that monotony. NASA psychologists see watering plants and measuring leaves as a vital outlet (horticultural therapy) that supports mental health and mood on missions lasting months or years.",
sa_h:"From space to our land",sa_p:"The water-saving, soil-free techniques developed for space are the same ones desert farming needs where water is scarce. What we learn up there serves food security down here.",
tm_h:"Project team",tm_p:"This project was prepared by two students of Technical Gifted High School for Space Week.",role:"Student | Technical Gifted High School",n_1:"Mohammed Turki Ali",n_2:"Turki Mansour Mohammed",a1:"M",a2:"T",

let L="ar",cur=0;
const $=s=>document.querySelector(s);
function render(){
 const t=T[L];
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 document.title=t.title+" | "+t.school;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
 $("#sw").textContent=L=="ar"?"English":"العربية";
 $("#tabs").innerHTML=t.tabs.map((x,i)=>`<button class="tab" role="tab" aria-selected="${i==cur}" data-i="${i}">${x.t}</button>`).join("");
 const p=t.tabs[cur];$("#panel").innerHTML=`<h3>${p.h}</h3><p>${p.b}</p>`;
 const cards=a=>a.map(x=>`<div class="card" style="--c:${x.c}"><h3>${x.t}</h3><p>${x.b}</p></div>`).join("");
 $("#sol").innerHTML=cards(t.sol);$("#mis").innerHTML=cards(t.mis);
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b){cur=+b.dataset.i;render()}});
$("#sw").onclick=()=>{L=L=="ar"?"en":"ar";render()};
document.querySelectorAll("#gate [data-l]").forEach(b=>b.onclick=()=>{L=b.dataset.l;render();$("#gate").classList.add("off");window.scrollTo(0,0)});
render();
</script>
